apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd

spec:
  project: platform

  source:
    repoURL: https://github.com/samimassoud/webhook-task-pipeline-dl.git
    targetRevision: main
    path: platform/argo-phase/charts/api
    helm:
      valueFiles:
        - ../../environments/dev/values-api.yaml
        - ../../environments/dev/values-shared.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: webhook-task-pipeline

  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight

  syncPolicy:
    automated:
      prune: true
      selfHeal: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
