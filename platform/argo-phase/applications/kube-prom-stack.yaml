apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: platform

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.5.4

      helm:
        valueFiles:
          - $values/platform/argo-phase/environments/dev/values-kube-prom-stack.yaml
    
    - repoURL: https://github.com/samimassoud/webhook-task-pipeline-dl.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true