---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "webhook-task-pipeline.adminSecretName" . }}
  namespace: {{ .Release.Namespace}}
  labels:
    {{- include "webhook-task-pipeline.labels" . | nindent 4}}
spec:
  encryptedData:
    DATABASE_URL: {{ .Values.sealedAdminSecret.encryptedDatabaseUrl}}
  template:
    metadata:
      name: {{ include "webhook-task-pipeline.adminSecretName" . }}
      namespace: {{ .Release.Namespace}}
    type: Opaque
