apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server
  namespace: platform-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: argocd-server-tls

  dnsNames:
    - argocd.dev.local
    - grpc.argocd.dev.local
    - grafana.dev.local

  duration: 2160h # 90 days

  renewBefore: 720h # 30 days

  issuerRef:
    name: local-ca
    kind: ClusterIssuer