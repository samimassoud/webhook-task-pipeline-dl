gatewayClass:
  controllerName: "gateway.envoyproxy.io/gatewayclass-controller"
  name: "envoy-gateway-class"
gateway:
  name: platform-gateway
  namespace: platform-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: ""

      allowedRoutes:
        namespaces:
          from: All

    - name: https
      protocol: HTTPS
      port: 443
      hostname: ""

      allowedRoutes:
        namespaces:
          from: All

      tls:
        mode: Terminate
        certificateRefs:
          - name: argocd-server-tls
            kind: Secret
            group: ""
gateway-helm:
  deployment:
    envoyGateway:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi

        limits:
          memory: 512Mi