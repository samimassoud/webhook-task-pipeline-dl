global:
  domain: argocd.dev.local

configs:
  secret:
    createSecret: false

  cm:
    admin.enabled: true

    resource.customizations.health.monitoring.coreos.com_Prometheus: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "Prometheus health check overridden"
      return hs

    resource.customizations.health.monitoring.coreos.com_Alertmanager: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "Alertmanager health check overridden"
      return hs

  params:
    server.insecure: true

dex:
  enabled: false

redis-ha:
  enabled: false

controller:
  replicas: 1

repoServer:
  replicas: 1

server:
  replicas: 1

  service:
    type: ClusterIP

  ingress:
    enabled: false

  ingressGrpc:
    enabled: false

  httproute:
    enabled: true

    parentRefs:
      - name: platform-gateway
        namespace: platform-gateway

    hostnames:
      - argocd.dev.local

  grpcroute:
    enabled: true

    parentRefs:
      - name: platform-gateway
        namespace: platform-gateway

    hostnames:
      - grpc.argocd.dev.local

    rules:
      - backendRefs:
          - name: argocd-server
            port: 80
redis:
  enabled: true

notifications:
  enabled: false