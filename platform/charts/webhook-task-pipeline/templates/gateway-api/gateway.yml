apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

---

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "webhook-task-pipeline.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webhook-task-pipeline.labels" . | nindent 4 }}
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "webhook-task-pipeline.fullname" . }}-api-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webhook-task-pipeline.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "webhook-task-pipeline.fullname" . }}-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: {{ include "webhook-task-pipeline.fullname" . }}-api
          port: {{ .Values.api.service.port }}