apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "webhook-task-pipeline.fullname" . }}-api-route
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webhook-task-pipeline.labels" . | nindent 4 }}

spec:
  parentRefs:
    - name: {{ required "gateway.parentRef.name must be set" .Values.gateway.parentRef.name }}
      namespace: {{ required "gateway.parentRef.namespace must be set" .Values.gateway.parentRef.namespace }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1

      backendRefs:
        - name: {{ include "webhook-task-pipeline.fullname" . }}-api
          port: {{ .Values.api.service.port }}