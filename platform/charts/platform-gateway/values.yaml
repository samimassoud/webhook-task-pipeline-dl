nameOverride: ""
fullnameOverride: ""

gatewayClass:
  name: envoy-gateway-class
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

gateway:
  name: platform-gateway
  namespace: ""
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: ""

      allowedRoutes:
        namespaces:
          from: All