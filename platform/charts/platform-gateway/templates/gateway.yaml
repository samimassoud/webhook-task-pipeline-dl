apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "platform-gateway.gatewayName" . }}
  namespace: {{ include "platform-gateway.gatewayNamespace" . }}
  labels:
    {{- include "platform-gateway.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ include "platform-gateway.gatewayClassName" . }}

  listeners:
    {{- range .Values.gateway.listeners }}
    - name: {{ .name }}
      protocol: {{ .protocol }}
      port: {{ .port }}

      {{- with .hostname }}
      hostname: {{ . | quote }}
      {{- end }}

      allowedRoutes:
        namespaces:
          from: {{ .allowedRoutes.namespaces.from }}
    {{- end }}