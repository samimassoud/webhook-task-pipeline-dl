name: CD

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/cd.yml'

permissions:
  contents: write

concurrency:
  group: cd-main
  cancel-in-progress: true

env:
  IMAGE_NAME: samihajji/webhook-task-pipeline

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webhook
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for specific folder changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            drizzle:
              - 'app/drizzle/**'

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test API
        run: |
          docker run -d \
            --name test-api \
            --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@localhost:5432/webhook" \
            ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }} \
            node dist/api/index.js

          sleep 15

          if [ "$(docker inspect -f '{{.State.Running}}' test-api)" != "true" ]; then
            echo "API failed to stay running"
            docker logs test-api
            exit 1
          fi

          curl --fail http://localhost:3000/api/v1/healthz || {
            docker logs test-api
            exit 1
            }

          docker rm -f test-api

      - name: Smoke Test Worker
        run: |
          docker run -d \
            --name test-worker \
            --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@localhost:5432/webhook" \
            ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }} \
            node dist/worker/index.js

          sleep 15

          if [ "$(docker inspect -f '{{.State.Running}}' test-worker)" != "true" ]; then
            echo "Worker failed to stay running"
            docker logs test-worker
            exit 1
          fi

          curl --fail http://localhost:3000/api/v1/healthz || {
            docker logs test-worker
            exit 1
            }

          docker rm -f test-worker

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}

      - name: Setup yq
        uses: mikefarah/yq@v4.44.3

      - name: Update API and Worker tags
        run: |
          yq e '(.spec.source.helm.parameters[] | select(.name == "image.tag")).value = "'${SHORT_SHA}'"' -i platform/argo-phase/applications/api.yaml

          yq e '(.spec.source.helm.parameters[] | select(.name == "image.tag")).value = "'${SHORT_SHA}'"' -i platform/argo-phase/applications/worker.yaml

      - name: Update Migration tag
        if: steps.filter.outputs.drizzle == 'true'
        run: |
          yq e '(.spec.source.helm.parameters[] | select(.name == "image.tag")).value = "'${SHORT_SHA}'"' -i platform/argo-phase/applications/migration.yaml

      - name: Commit and Push GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add platform/argo-phase/applications/

          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "cd: bump application images to ${SHORT_SHA}"
            git push
          fi